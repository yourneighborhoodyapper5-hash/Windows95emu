<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreeDOS Emulator</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: "Trebuchet MS", "Segoe UI", sans-serif;
            background: #080909;
            color: #a1a7a9;
            --line: #1a1d1e;
            --muted: #72797b;
            --accent: #41484a;
            --console: #090a0a;
        }
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }
        body {
            background: #080909;
        }
        button, input { font: inherit; }
        button {
            min-height: 34px;
            padding: 0 11px;
            border: 1px solid #1c2021;
            border-radius: 3px;
            background: #0d0f10;
            color: #a1a7a9;
            cursor: pointer;
            transition: background-color 120ms ease, border-color 120ms ease;
        }
        button:hover { background: #151819; border-color: #353b3d; }
        button:focus-visible, input:focus-visible {
            outline: 2px solid #777f82;
            outline-offset: 2px;
        }
        #app {
            display: flex;
            width: 100%;
            height: 100%;
            padding: 8px;
            gap: 8px;
        }
        #emulator-panel, #debug-panel {
            min-width: 0;
            overflow: hidden;
            border: 1px solid #171a1b;
            border-radius: 3px;
        }
        #emulator-panel {
            display: flex;
            flex: 1 1 auto;
            flex-direction: column;
            background: #090c0e;
        }
        #topbar, #debug-topbar {
            display: flex;
            min-height: 48px;
            flex-shrink: 0;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            background: #0b0d0e;
            border-bottom: 1px solid #191c1d;
        }
        #title {
            font-size: 15px;
            font-weight: 700;
        }
        #boot-disk-label {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--muted);
            font-size: 12px;
        }
        #boot-disk {
            min-height: 32px;
            padding: 0 8px;
            border: 1px solid #1c2021;
            border-radius: 3px;
            background: #0d0f10;
            color: #a1a7a9;
            font: inherit;
        }
        #status {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-left: auto;
            color: #777f82;
            font-family: "Courier New", monospace;
            font-size: 11px;
            letter-spacing: 0.04em;
        }
        #status::before {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #545b5d;
            content: "";
        }
        #status.success::before { background: #647568; }
        #status.warning::before { background: #77705c; }
        #status.error::before { background: #795c59; }
        #status.boot::before { background: #5e6b70; }
        #terminal-toggle { white-space: nowrap; }
        #screen-container {
            display: flex;
            flex: 1;
            min-height: 0;
            align-items: center;
            justify-content: center;
            overflow: auto;
            padding: 18px;
            background: #080909;
        }
        #screen {
            max-width: 100%;
            background: #000;
            white-space: pre;
            font: 14px monospace;
            line-height: 14px;
        }
        #screen canvas {
            max-width: 100%;
            height: auto;
        }
        #debug-panel {
            display: flex;
            flex: 0 1 clamp(300px, 34vw, 440px);
            flex-direction: column;
            background: var(--console);
        }
        #debug-topbar {
            min-height: 48px;
            padding: 0 10px 0 14px;
            background: #0b0d0e;
            border-bottom-color: var(--line);
        }
        #debug-title {
            color: #868e91;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
        }
        #buttons { display: flex; gap: 6px; margin-left: auto; }
        #buttons button { min-height: 30px; padding: 0 9px; font-size: 12px; }
        #logs {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding: 13px 14px;
            color: #92999b;
            font-family: "Courier New", monospace;
            font-size: 12px;
            line-height: 1.55;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .log { margin-bottom: 3px; }
        .info { color: #92999b; }
        .boot { color: #788286; }
        .success { color: #829087; }
        .warning { color: #91876d; }
        .error { color: #a17b76; }
        .serial { color: #747c7f; }
        #command-bar {
            display: flex;
            gap: 8px;
            padding: 10px;
            border-top: 1px solid var(--line);
            background: #0b0d0e;
        }
        #command {
            flex: 1;
            min-width: 0;
            padding: 0 10px;
            border: 1px solid #202526;
            border-radius: 3px;
            background: #090b0c;
            color: #b0b6b8;
            font-family: "Courier New", monospace;
        }
        #command::placeholder { color: #555d5f; }
        #app.terminal-hidden #debug-panel { display: none; }
        @media (max-width: 760px) {
            #app { flex-direction: column; padding: 8px; gap: 8px; }
            #emulator-panel { flex: 1 1 60%; }
            #debug-panel { flex: 1 1 40%; }
            #app.terminal-hidden #emulator-panel { flex: 1 1 100%; }
            #screen-container { padding: 8px; }
        }
        @media (max-width: 420px) {
            #topbar { gap: 8px; padding: 0 9px; }
            #title { font-size: 13px; }
            #boot-disk-label { gap: 4px; font-size: 10px; }
            #boot-disk { max-width: 120px; padding: 0 5px; font-size: 11px; }
            #topbar button { padding: 0 8px; font-size: 12px; }
            #debug-topbar { padding: 0 8px; }
            #debug-title { font-size: 10px; }
            #buttons { gap: 4px; }
            #buttons button { padding: 0 7px; font-size: 11px; }
        }
    </style>
</head>
<body>
<div id="app">
    <!-- =========================
         EMULATOR
    ========================= -->
    <section id="emulator-panel">
        <div id="topbar">
            <span id="title">
                FreeDOS
            </span>
            <label id="boot-disk-label" for="boot-disk">
                Boot from
                <select id="boot-disk" onchange="selectBootDisk()">
                    <option value="freedos">FreeDOS</option>
                    <option value="win95">Windows 95 setup floppy</option>
                </select>
            </label>
            <span id="status">
                INITIALIZING
            </span>
            <button
                id="terminal-toggle"
                type="button"
                aria-controls="debug-panel"
                aria-expanded="true"
                onclick="toggleTerminal()"
            >
                Hide terminal
            </button>
        </div>
        <div id="screen-container">
            <div id="screen"></div>
        </div>
    </section>
    <!-- =========================
         DEBUG
    ========================= -->
    <section id="debug-panel">
        <div id="debug-topbar">
            <span id="debug-title">
                EMULATOR LOG
            </span>
            <div id="buttons">
                <button onclick="clearLogs()">
                    CLEAR
                </button>
                <button onclick="restartEmulator()">
                    RESTART
                </button>
            </div>
        </div>
        <div id="logs"></div>
        <div id="command-bar">
            <input
                id="command"
                type="text"
                placeholder="help / status / restart / clear"
                autocomplete="off"
            >
            <button onclick="runCommand()">
                RUN
            </button>
        </div>
    </section>
</div>
<!-- =========================
     V86
========================= -->
<script src="./libv86.js"></script>
<script>
"use strict";
/* =====================================================
   GLOBALS
===================================================== */
let emulator = null;
let startRequest = 0;
const logs =
    document.getElementById("logs");
const status =
    document.getElementById("status");
const command =
    document.getElementById("command");
const bootDiskSelect =
    document.getElementById("boot-disk");
const title =
    document.getElementById("title");
/* =====================================================
   LOGGING
===================================================== */
function timestamp() {
    return new Date()
        .toLocaleTimeString();
}
function log(message, type = "info") {
    const element =
        document.createElement("div");
    element.className =
        "log " + type;
    element.textContent =
        "[" + timestamp() + "] " + message;
    logs.appendChild(element);
    logs.scrollTop =
        logs.scrollHeight;
}
function clearLogs() {
    logs.innerHTML = "";
    log(
        "Debug output cleared.",
        "info"
    );
}
function toggleTerminal() {
    const app = document.getElementById("app");
    const toggle = document.getElementById("terminal-toggle");
    const isHidden = app.classList.toggle("terminal-hidden");
    toggle.textContent =
        isHidden ? "Show terminal" : "Hide terminal";
    toggle.setAttribute(
        "aria-expanded",
        String(!isHidden)
    );
}
/* =====================================================
   STATUS
===================================================== */
function setStatus(text, type = "info") {
    status.textContent =
        text;
    status.className =
        type;
}
/* =====================================================
   BROWSER ERRORS
===================================================== */
window.addEventListener(
    "error",
    function(event) {
        log(
            "JavaScript ERROR: " +
            event.message +
            " @ " +
            event.filename +
            ":" +
            event.lineno,
            "error"
        );
        setStatus(
            "ERROR",
            "error"
        );
    }
);
window.addEventListener(
    "unhandledrejection",
    function(event) {
        log(
            "Unhandled rejection: " +
            event.reason,
            "error"
        );
        setStatus(
            "ERROR",
            "error"
        );
    }
);
/* =====================================================
   SERIAL OUTPUT
===================================================== */
let serialBuffer = "";
function handleSerialByte(byte) {
    /*
     * Convert the v86 serial byte
     * into a character.
     */
    const character =
        String.fromCharCode(byte);
    /*
     * Ignore carriage returns.
     */
    if (character === "\r") {
        return;
    }
    /*
     * New line = print the buffer.
     */
    if (character === "\n") {
        if (serialBuffer.length > 0) {
            log(
                "SERIAL: " +
                serialBuffer,
                "serial"
            );
            serialBuffer = "";
        }
        return;
    }
    serialBuffer += character;
    /*
     * Prevent an enormous line
     * from filling the browser.
     */
    if (serialBuffer.length > 500) {
        log(
            "SERIAL: " +
            serialBuffer,
            "serial"
        );
        serialBuffer = "";
    }
}
/* =====================================================
   START EMULATOR
===================================================== */
async function startEmulator() {
    const request =
        ++startRequest;
    const bootDisk =
        bootDiskSelect.value;
    const bootDiskName =
        bootDisk === "win95"
            ? "Windows 95 setup floppy"
            : "FreeDOS";
    title.textContent =
        bootDiskName;
    log(
        "Starting emulator with " +
        bootDiskName +
        " as drive A: and Windows 95 CD attached...",
        "boot"
    );
    setStatus(
        "STARTING",
        "boot"
    );
    /*
     * Make sure libv86.js loaded.
     */
    if (
        typeof V86 === "undefined"
    ) {
        log(
            "V86 was not found.",
            "error"
        );
        log(
            "Check that ./libv86.js exists and loaded correctly.",
            "error"
        );
        setStatus(
            "V86 MISSING",
            "error"
        );
        return;
    }
    log(
        "v86 library detected.",
        "success"
    );
    try {
        const [freedosResponse, windows95Response] =
            await Promise.all([
                fetch("./freedos.img"),
                fetch("./win95.img")
            ]);
        if (!freedosResponse.ok) {
            throw new Error(
                "FreeDOS image request failed: " +
                freedosResponse.status
            );
        }
        if (!windows95Response.ok) {
            throw new Error(
                "Windows 95 setup floppy request failed: " +
                windows95Response.status
            );
        }
        const [freedosBuffer, windows95Buffer] =
            await Promise.all([
                freedosResponse.arrayBuffer(),
                windows95Response.arrayBuffer()
            ]);
        if (request !== startRequest) {
            return;
        }
        const bootBuffer =
            bootDisk === "win95"
                ? windows95Buffer
                : freedosBuffer;
        const secondaryBuffer =
            bootDisk === "win95"
                ? freedosBuffer
                : windows95Buffer;
        log(
            "FreeDOS and Windows 95 setup floppy images loaded.",
            "success"
        );
        log(
            bootDiskName +
            " is drive A:; the other floppy is drive B:.",
            "info"
        );
        log(
            "Windows 95 installation CD will be connected as a virtual CD-ROM.",
            "info"
        );
        log(
            "Creating V86 instance...",
            "boot"
        );
        emulator = new V86({
            /* =====================
               V86 WASM
            ===================== */
            wasm_path:
                "./v86.wasm",
            /* =====================
               DISPLAY
            ===================== */
            screen_container:
                document.getElementById(
                    "screen"
                ),
            /* =====================
               BIOS
            ===================== */
            bios: {
                url: "./seabios.bin"
            },
            vga_bios: {
                url: "./vgabios.bin"
            },
            /* =====================
               FLOPPY DRIVE
            ===================== */
            fda: {
                buffer: bootBuffer
            },
            fdb: {
                buffer: secondaryBuffer
            },
            cdrom: {
                url: "./windows95.iso",
                async: true
            },
            /* =====================
               MEMORY
            ===================== */
            memory_size:
                128 * 1024 * 1024,
            vga_memory_size:
                8 * 1024 * 1024,
            /* =====================
               SERIAL
            ===================== */
            serial_container:
                document.getElementById(
                    "logs"
                ),
            /* =====================
               START
            ===================== */
            autostart: true,
            /* =====================
               MOUSE
            ===================== */
            disable_mouse: false
        });
        log(
            "V86 instance created.",
            "success"
        );
        setStatus(
            "BOOTING",
            "boot"
        );
        /*
         * Serial output.
         */
        emulator.add_listener(
            "serial0-output-byte",
            handleSerialByte
        );
        /*
         * Emulator ready.
         */
        emulator.add_listener(
            "emulator-ready",
            function() {
                log(
                    "Emulator ready.",
                    "success"
                );
                setStatus(
                    "READY",
                    "success"
                );
            }
        );
        /*
         * Emulator started.
         */
        emulator.add_listener(
            "emulator-started",
            function() {
                log(
                    "Emulator started.",
                    "success"
                );
                setStatus(
                    "RUNNING",
                    "success"
                );
            }
        );
        /*
         * Emulator stopped.
         */
        emulator.add_listener(
            "emulator-stopped",
            function() {
                log(
                    "Emulator stopped.",
                    "warning"
                );
                setStatus(
                    "STOPPED",
                    "warning"
                );
            }
        );
        /*
         * Disk download progress.
         */
        emulator.add_listener(
            "download-progress",
            function(event) {
                if (!event) {
                    return;
                }
                const loaded =
                    event.loaded || 0;
                const total =
                    event.total || 0;
                if (total > 0) {
                    const percent =
                        (
                            loaded /
                            total *
                            100
                        ).toFixed(1);
                    log(
                        "Disk loading: " +
                        percent +
                        "%",
                        "boot"
                    );
                }
            }
        );
        log(
            "Waiting for " +
            bootDiskName +
            " boot...",
            "boot"
        );
    } catch (error) {
        if (request !== startRequest) {
            return;
        }
        log(
            "Failed to start V86:",
            "error"
        );
        log(
            error.stack ||
            String(error),
            "error"
        );
        setStatus(
            "FAILED",
            "error"
        );
    }
}
/* =====================================================
   RESTART
===================================================== */
function restartEmulator() {
    startRequest += 1;
    log(
        "Restart requested.",
        "warning"
    );
    try {
        if (emulator) {
            log(
                "Stopping emulator...",
                "boot"
            );
            emulator.stop();
            emulator = null;
        }
        function selectBootDisk() {
            log(
                "Boot image changed to " +
                bootDiskSelect.options[
                    bootDiskSelect.selectedIndex
                ].text +
                ".",
                "info"
            );
            restartEmulator();
        }
    } catch (error) {
        log(
            "Error stopping emulator: " +
            error,
            "error"
        );
    }
    document
        .getElementById("screen")
        .innerHTML = "";
    serialBuffer = "";
    setStatus(
        "RESTARTING",
        "boot"
    );
    setTimeout(
        function() {
            startEmulator();
        },
        500
    );
}
/* =====================================================
   COMMANDS
===================================================== */
function runCommand() {
    const input =
        command.value.trim();
    if (!input) {
        return;
    }
    log(
        "> " + input,
        "info"
    );
    command.value = "";
    switch (
        input.toLowerCase()
    ) {
        case "help":
            log(
                "Available commands:",
                "info"
            );
            log(
                "help",
                "info"
            );
            log(
                "status",
                "info"
            );
            log(
                "restart",
                "info"
            );
            log(
                "clear",
                "info"
            );
            break;
        case "status":
            if (emulator) {
                log(
                    "V86 instance exists.",
                    "success"
                );
            } else {
                log(
                    "No V86 instance.",
                    "warning"
                );
            }
            break;
        case "restart":
            restartEmulator();
            break;
        case "clear":
            clearLogs();
            break;
        default:
            log(
                "Unknown command: " +
                input,
                "warning"
            );
    }
}
command.addEventListener(
    "keydown",
    function(event) {
        if (
            event.key === "Enter"
        ) {
            runCommand();
        }
    }
);
/* =====================================================
   INITIAL BOOT LOG
===================================================== */
log(
    "========================================",
    "boot"
);
log(
    "FreeDOS browser emulator",
    "boot"
);
log(
    "Initializing browser emulator...",
    "boot"
);
log(
    "========================================",
    "boot"
);
/* =====================================================
   START
===================================================== */
startEmulator();
</script>
</body>
</html>
