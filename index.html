<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 95 in the Browser</title>
    <!-- Import the official v86 library -->
    <script src="https://copy.sh"></script>
    <style>
        body {
            background-color: #008080; /* Classic Win95 Teal */
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }
        #title-bar {
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px black;
        }
        #screen_container {
            background-color: black;
            border: 4px outset #dfdfdf;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.5);
            position: relative;
        }
        /* v86 internally creates a text div and a canvas element */
        #screen_container canvas {
            display: block;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.1rem;
            color: #fff;
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #fff;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #controls {
            margin-top: 15px;
        }
        button {
            background: #dfdfdf;
            border-left: 2px solid #fff;
            border-top: 2px solid #fff;
            border-right: 2px solid #808080;
            border-bottom: 2px solid #808080;
            padding: 4px 12px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        button:active {
            border-left: 2px solid #808080;
            border-top: 2px solid #808080;
            border-right: 2px solid #fff;
            border-bottom: 2px solid #fff;
        }
    </style>
</head>
<body>

    <div id="title-bar">🖳 Windows 95 Web Emulator</div>

    <div id="screen_container">
        <div id="loading">
            <div class="spinner"></div>
            Loading Windows 95 Image...<br><small style="color:#bbb;">(May take a moment)</small>
        </div>
        <!-- v86 will automatically render the canvas text here -->
        <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
        <canvas style="display: none"></canvas>
    </div>

    <div id="controls">
        <button id="fullscreen-btn">Go Fullscreen</button>
    </div>

    <script>
        window.onload = function() {
            // Initialize the emulator targeting official public assets
            var emulator = new V86({
                wasm_path: "https://copy.sh",
                memory_size: 64 * 1024 * 1024,     // Allocate 64MB RAM
                vga_memory_size: 4 * 1024 * 1024, // 4MB Video Memory
                screen_container: document.getElementById("screen_container"),
                bios: { url: "https://copy.sh" },
                vga_bios: { url: "https://copy.sh" },
                // Use a pre-configured Windows 95 snapshot state
                initial_state: { url: "https://copy.sh" },
                autostart: true
            });

            // Hide the loading spinner once the emulator successfully boots
            emulator.add_listener("emulator-ready", function() {
                var loadingEl = document.getElementById("loading");
                if (loadingEl) loadingEl.style.display = "none";
            });

            // Handle Fullscreen Button
            document.getElementById("fullscreen-btn").onclick = function() {
                emulator.screen_go_fullscreen();
            };
        };
    </script>
</body>
</html>
