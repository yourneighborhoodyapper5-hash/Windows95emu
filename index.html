<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Windows 95 Emulator — Debug</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #111;
            color: #eee;
            font-family: monospace;
            overflow: hidden;
        }

        #app {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* Emulator */
        #emulator-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        #emulator-header {
            height: 36px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            background: #222;
            border-bottom: 1px solid #444;
            color: #ddd;
            gap: 12px;
        }

        #status {
            margin-left: auto;
            color: #aaa;
        }

        #screen-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: auto;
            background: #000;
        }

        #screen {
            background: #000;
        }

        /* Debug panel */
        #debug-panel {
            width: 420px;
            max-width: 42%;
            display: flex;
            flex-direction: column;
            background: #090909;
            border-left: 1px solid #444;
        }

        #debug-header {
            height: 36px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            background: #1d1d1d;
            border-bottom: 1px solid #444;
        }

        #debug-title {
            font-weight: bold;
        }

        #buttons {
            margin-left: auto;
            display: flex;
            gap: 5px;
        }

        button {
            border: 1px solid #555;
            background: #292929;
            color: #eee;
            padding: 4px 8px;
            cursor: pointer;
            font-family: monospace;
        }

        button:hover {
            background: #3a3a3a;
        }

        #logs {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 12px;
            line-height: 1.4;
        }

        .log {
            margin-bottom: 3px;
        }

        .info {
            color: #ccc;
        }

        .success {
            color: #7cff7c;
        }

        .warning {
            color: #ffd166;
        }

        .error {
            color: #ff6b6b;
        }

        .boot {
            color: #66b3ff;
        }

        #command-bar {
            border-top: 1px solid #444;
            padding: 6px;
            display: flex;
            gap: 6px;
        }

        #command {
            flex: 1;
            min-width: 0;
            background: #111;
            color: #fff;
            border: 1px solid #444;
            padding: 6px;
            font-family: monospace;
            outline: none;
        }

        @media (max-width: 800px) {
            #app {
                flex-direction: column;
            }

            #debug-panel {
                width: 100%;
                max-width: none;
                height: 40%;
                border-left: none;
                border-top: 1px solid #444;
            }

            #emulator-panel {
                height: 60%;
            }
        }
    </style>
</head>

<body>

<div id="app">

    <!-- Emulator -->
    <section id="emulator-panel">

        <div id="emulator-header">
            <strong>Windows 95 Emulator</strong>
            <span id="status">INITIALIZING</span>
        </div>

        <div id="screen-container">
            <div id="screen"></div>
        </div>

    </section>

    <!-- Debug / Terminal -->
    <section id="debug-panel">

        <div id="debug-header">

            <span id="debug-title">
                BOOT / DEBUG OUTPUT
            </span>

            <div id="buttons">
                <button onclick="clearLogs()">CLEAR</button>
                <button onclick="restartEmulator()">RESTART</button>
            </div>

        </div>

        <div id="logs"></div>

        <div id="command-bar">
            <input
                id="command"
                type="text"
                placeholder="Debug command..."
                autocomplete="off"
            >
            <button onclick="runCommand()">RUN</button>
        </div>

    </section>

</div>

<!-- v86 -->
<script src="libv86.js"></script>

<script>
"use strict";

/*
 * Windows95emu Debug Launcher
 */

let emulator = null;

const logs = document.getElementById("logs");
const statusElement = document.getElementById("status");
const commandInput = document.getElementById("command");


/* --------------------------------------------------
 * Logging
 * -------------------------------------------------- */

function timestamp() {
    return new Date().toLocaleTimeString();
}

function log(message, type = "info") {
    const line = document.createElement("div");

    line.className = `log ${type}`;

    line.textContent =
        `[${timestamp()}] ${message}`;

    logs.appendChild(line);

    logs.scrollTop = logs.scrollHeight;

    // Also keep normal browser console output
    if (type === "error") {
        console.error(message);
    } else if (type === "warning") {
        console.warn(message);
    } else {
        console.log(message);
    }
}

function clearLogs() {
    logs.innerHTML = "";
    log("Debug output cleared.");
}


/* --------------------------------------------------
 * Status
 * -------------------------------------------------- */

function setStatus(text, type = "info") {
    statusElement.textContent = text;

    statusElement.className = type;
}


/* --------------------------------------------------
 * Browser error reporting
 * -------------------------------------------------- */

window.addEventListener("error", event => {
    log(
        `JavaScript ERROR: ${event.message} @ ${event.filename}:${event.lineno}`,
        "error"
    );

    setStatus("ERROR", "error");
});

window.addEventListener("unhandledrejection", event => {
    log(
        `Unhandled Promise rejection: ${event.reason}`,
        "error"
    );

    setStatus("ERROR", "error");
});


/* --------------------------------------------------
 * Emulator startup
 * -------------------------------------------------- */

function startEmulator() {

    log("Starting Windows 95 emulator...", "boot");

    setStatus("STARTING", "boot");

    if (typeof V86Starter === "undefined") {
        log(
            "V86Starter was not found. Check that libv86.js exists.",
            "error"
        );

        setStatus("V86 MISSING", "error");

        return;
    }

    log("v86 library loaded successfully.", "success");

    try {

        log("Creating emulator instance...", "boot");

        emulator = new V86Starter({

            /* Display */
            screen_container:
                document.getElementById("screen"),

            /* BIOS */
            bios: {
                url: "seabios.bin"
            },

            vga_bios: {
                url: "vgabios.bin"
            },

            /* Windows 95 disk */
            hda: {
                url: "win95.img",
                async: true
            },

            /* Memory */
            memory_size: 128 * 1024 * 1024,

            /* Video */
            vga_memory_size: 8 * 1024 * 1024,

            /* Start immediately */
            autostart: true,

            /* Debugging */
            disable_mouse: false,

            /* Enable serial output */
            serial_container:
                document.getElementById("logs")

        });

        log(
            "V86 emulator object created.",
            "success"
        );

        setStatus("BOOTING", "boot");

        /*
         * v86 events
         */

        emulator.add_listener("emulator-ready", () => {

            log(
                "v86 reports emulator-ready.",
                "success"
            );

            setStatus("READY", "success");

        });

        emulator.add_listener("emulator-started", () => {

            log(
                "Emulator started.",
                "success"
            );

            setStatus("RUNNING", "success");

        });

        emulator.add_listener("emulator-stopped", () => {

            log(
                "Emulator stopped.",
                "warning"
            );

            setStatus("STOPPED", "warning");

        });

        emulator.add_listener("download-progress", event => {

            if (!event) return;

            const loaded =
                event.loaded || 0;

            const total =
                event.total || 0;

            if (total > 0) {

                const percent =
                    ((loaded / total) * 100).toFixed(1);

                log(
                    `Disk download: ${percent}%`,
                    "boot"
                );
            }

        });

        log(
            "Waiting for BIOS / disk boot...",
            "boot"
        );

    } catch (error) {

        log(
            `Failed to create emulator: ${error.stack || error}`,
            "error"
        );

        setStatus("FAILED", "error");

    }
}


/* --------------------------------------------------
 * Restart
 * -------------------------------------------------- */

function restartEmulator() {

    log("Restart requested.", "warning");

    try {

        if (emulator) {

            log("Stopping current emulator...", "boot");

            emulator.stop();

            emulator = null;
        }

    } catch (error) {

        log(
            `Error stopping emulator: ${error}`,
            "error"
        );
    }

    document.getElementById("screen").innerHTML = "";

    setTimeout(() => {

        log("Starting emulator again...", "boot");

        startEmulator();

    }, 500);
}


/* --------------------------------------------------
 * Debug command input
 * -------------------------------------------------- */

function runCommand() {

    const command =
        commandInput.value.trim();

    if (!command) return;

    log(`> ${command}`, "info");

    commandInput.value = "";

    /*
     * These are local debug commands.
     */

    switch (command.toLowerCase()) {

        case "help":
            log(
                "Commands: help, status, restart, clear",
                "info"
            );
            break;

        case "status":

            if (emulator) {
                log(
                    "Emulator object exists.",
                    "success"
                );
            } else {
                log(
                    "Emulator object does not exist.",
                    "warning"
                );
            }

            break;

        case "restart":
            restartEmulator();
            break;

        case "clear":
            clearLogs();
            break;

        default:
            log(
                `Unknown debug command: ${command}`,
                "warning"
            );
    }
}

commandInput.addEventListener("keydown", event => {

    if (event.key === "Enter") {
        runCommand();
    }

});


/* --------------------------------------------------
 * Initial boot
 * -------------------------------------------------- */

log("----------------------------------------", "boot");
log("Windows95emu debug launcher", "boot");
log("Initializing...", "boot");
log("----------------------------------------", "boot");

startEmulator();

</script>

</body>
</html>
